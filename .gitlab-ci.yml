# GitLab CI pipeline for the Aprilaire 8800 (RS-485) HA integration.
#
# GitLab is the canonical home of this repo; GitHub is a pull-based mirror
# whose only job is making the integration installable through HACS. The
# HACS/hassfest GitHub Actions live in .github/workflows/ and run on the
# mirror (they validate the HACS/HA-side metadata, not the code). This
# pipeline is the actual CI for the project: lint + tests on every push.

stages:
  - lint
  - test

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .pip-cache/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# ----- lint -----

lint:ruff:
  stage: lint
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - ruff check .
    - ruff format --check .

# ----- tests -----
#
# Two test jobs by design:
#
#   test:protocol  - minimum dependencies (pyserial + pytest only). Covers
#                    test_protocol.py, test_coordinator.py, test_outdoor_temp.py
#                    (the pure-Python state/wire-format tests). Fast feedback
#                    on the layer that has no HA coupling.
#
#   test:ha        - full pytest-homeassistant-custom-component stack. Covers
#                    everything plus the HA-aware test files. Slower but
#                    exercises the platforms end-to-end against a real
#                    in-process Home Assistant.

test:protocol:
  stage: test
  needs: ["lint:ruff"]
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[test]"
  script:
    - pytest -v tests/test_protocol.py tests/test_coordinator.py tests/test_outdoor_temp.py

test:ha:
  stage: test
  needs: ["lint:ruff"]
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[test-ha]"
  script:
    - pytest -v tests/
